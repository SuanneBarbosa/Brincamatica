name: Mathnew
description: "A new Flutter project."
publish_to: 'none' 
version: 1.5.1+2

environment:
  sdk: ^3.5.3

dependencies:
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_joystick: ^0.2.1
  audioplayers: ^5.2.1
  just_audio: ^0.9.42
  shared_preferences: ^2.0.15
  async: ^2.9.0
  intl: ^0.19.0
  scrollable_positioned_list: ^0.3.8
  collection: ^1.18.0
  webview_flutter: ^4.10.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  


flutter:
  uses-material-design: true
  assets:

    - assets/images/characters/character_boy_dark.png
    - assets/images/characters/character_boy_light.png
    - assets/images/characters/character_girl_dark.png
    - assets/images/characters/character_girl_light.png

    - assets/images/characters/
    - assets/images/icons/
    - assets/images/buttons/
    - assets/images/personagem.png
    
    - assets/images/IFSP_Logo.png
    - assets/images/CNPQ_Logo.png
    - assets/images/RUMO_Logo.png

    
    - assets/sounds/assobiar.mp3
    - assets/sounds/baterPes.mp3
    - assets/sounds/baterPalma.mp3 
    - assets/sounds/estalarDedos.mp3
    - assets/sounds/baterPeito.mp3
    - assets/sounds/baterPerna.mp3 
    - assets/sounds/gritar.mp3
    - assets/sounds/estalarLingua1.mp3
    - assets/sounds/estalarLingua2.mp3 
    - assets/sounds/beijo.mp3
    - assets/sounds/correto.mp3
